; PlatformIO Project Configuration File for FootBot
; Single source of truth for platform, dependencies, and environments

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7
    mathieucarbou/AsyncTCP
    mathieucarbou/ESPAsyncWebServer
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Iinclude

[env:native]
platform = native
test_framework = unity
build_src_filter = +<core/>
build_flags =
    -std=gnu++17
    -Iinclude

